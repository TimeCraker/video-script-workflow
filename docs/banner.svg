<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="video-script-workflow banner">
  <defs>
    <linearGradient id="vswBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E26"/>
      <stop offset="50%" stop-color="#1E1336"/>
      <stop offset="100%" stop-color="#0E0A1A"/>
    </linearGradient>
    <radialGradient id="pinkGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <style>
      .kicker { font: 700 11px ui-monospace, 'Cascadia Mono', monospace; fill: #F43F5E; letter-spacing: 3px; }
      .title { font: 800 38px 'Segoe UI', -apple-system, sans-serif; fill: #FFFFFF; letter-spacing: -0.5px; }
      .sub { font: 500 14.5px 'PingFang SC', 'Microsoft YaHei', sans-serif; fill: #C4B5FD; }
      .tag { font: 600 11px ui-monospace, monospace; fill: #F1F5F9; }
      .card { fill: #2E1F4D; stroke: #4C3575; stroke-width: 1; }
    </style>
  </defs>

  <rect width="920" height="280" rx="16" fill="url(#vswBg)"/>
  <rect width="920" height="280" rx="16" fill="url(#pinkGlow)"/>
  <rect width="920" height="280" rx="16" fill="url(#purpleGlow)"/>
  <rect width="920" height="280" rx="16" fill="none" stroke="#372659" stroke-width="1.5"/>

  <!-- Left Clapperboard Icon -->
  <g transform="translate(60, 65)">
    <rect x="10" y="24" width="76" height="56" rx="8" fill="#24173D" stroke="#A855F7" stroke-width="2"/>
    <path d="M 10 32 L 86 16 L 82 8 L 6 24 Z" fill="#F43F5E"/>
    <!-- Stripes -->
    <polygon points="20,22 30,20 26,10 16,12" fill="#FFFFFF"/>
    <polygon points="40,18 50,16 46,6 36,8" fill="#FFFFFF"/>
    <polygon points="60,14 70,12 66,2 56,4" fill="#FFFFFF"/>
    <circle cx="48" cy="52" r="12" fill="#381E68"/>
    <polygon points="44,46 56,52 44,58" fill="#F43F5E"/>
  </g>

  <!-- Typography -->
  <g transform="translate(190, 62)">
    <text x="0" y="20" class="kicker">AI ANIME SCRIPTWRITING &amp; STORYBOARD WORKFLOW</text>
    <text x="0" y="64" class="title">video-script-workflow</text>
    <text x="0" y="94" class="sub">AI 动漫短剧剧本与分镜创作工坊 · 角色档案库 · 逐秒分镜剧本 · 本地沉浸阅读器</text>

    <!-- Pills -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="138" height="26" rx="5" class="card"/>
      <circle cx="12" cy="13" r="3.5" fill="#F43F5E"/>
      <text x="24" y="17" class="tag">Character Bible</text>

      <rect x="150" y="0" width="158" height="26" rx="5" class="card"/>
      <circle cx="162" cy="13" r="3.5" fill="#A855F7"/>
      <text x="174" y="17" class="tag">Second-by-Second</text>

      <rect x="320" y="0" width="148" height="26" rx="5" class="card"/>
      <circle cx="332" cy="13" r="3.5" fill="#38BDF8"/>
      <text x="344" y="17" class="tag">Prompt Pipeline</text>

      <rect x="480" y="0" width="138" height="26" rx="5" class="card"/>
      <circle cx="492" cy="13" r="3.5" fill="#34D399"/>
      <text x="504" y="17" class="tag">HTML5 Reader</text>
    </g>
  </g>
</svg>
